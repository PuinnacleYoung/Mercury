# 拾光·澈屿 —— nginx 站点配置（HTTP 版，裸 IP 直访）
# 2026-09-23 加「短路径马甲」：把 /src/xxx.html 藏成 /game/ /map/ 等好记地址

server {
    listen 80 default_server;
    server_name _;

    root /opt/mercury;
    index index.html;

    client_max_body_size 60m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 联机 WebSocket：/ws -> 本机 8090 ----------
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://127.0.0.1:8090; }

    # ---------- 短路径马甲：不带斜杠自动补上，方便直接发链接 ----------
    location ~ ^/(game|map|dress|tarot|npc|bank|merge|admin|login|backup|restore)$ {
        return 302 $uri/;
    }

    # ---------- 马甲目录本体（必须排在静态缓存规则之前） ----------
    # 规则：/马甲/  ->  对应的 html；/马甲/xxx.js  ->  /src/xxx.js
    # 页面内全是相对引用 ./xxx.js，所以套上目录后自动跟着走，一个都不会 404
    location ~ ^/game/   { rewrite ^/game/$   /src/index.html            break; rewrite ^/game/(.+)$   /src/$1 break; }
    location ~ ^/map/    { rewrite ^/map/$    /src/地图编辑引擎.html      break; rewrite ^/map/(.+)$    /src/$1 break; }
    location ~ ^/dress/  { rewrite ^/dress/$  /src/服装编辑引擎.html      break; rewrite ^/dress/(.+)$  /src/$1 break; }
    location ~ ^/tarot/  { rewrite ^/tarot/$  /src/塔罗编辑引擎.html      break; rewrite ^/tarot/(.+)$  /src/$1 break; }
    location ~ ^/npc/    { rewrite ^/npc/$    /src/NPC编辑引擎.html      break; rewrite ^/npc/(.+)$    /src/$1 break; }
    location ~ ^/bank/   { rewrite ^/bank/$   /src/银行引擎.html          break; rewrite ^/bank/(.+)$   /src/$1 break; }
    location ~ ^/merge/  { rewrite ^/merge/$  /src/二合游戏引擎.html      break; rewrite ^/merge/(.+)$  /src/$1 break; }
    location ~ ^/admin/  { rewrite ^/admin/$  /src/后端管理引擎.html      break; rewrite ^/admin/(.+)$  /src/$1 break; }
    location ~ ^/login/  { rewrite ^/login/$  /src/登录页面引擎.html      break; rewrite ^/login/(.+)$  /src/$1 break; }
    location ~ ^/backup/ { rewrite ^/backup/$ /src/数据备份与迁移.html    break; rewrite ^/backup/(.+)$ /src/$1 break; }
    location ~ ^/restore/ { rewrite ^/restore/$ /src/数据恢复工具.html    break; rewrite ^/restore/(.+)$ /src/$1 break; }

    # ---------- sw.js 永不缓存（排在 js 缓存规则之前） ----------
    location ~ sw\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 静态资源：长期缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff2|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- HTML / JSON：绝不缓存（改完立刻生效） ----------
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
