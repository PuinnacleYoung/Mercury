# 拾光·澈屿 —— nginx 站点配置（HTTP 版，裸 IP 直访，先跑通用）
# 用法：sudo cp nginx-http.conf /etc/nginx/conf.d/mercury.conf && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    root /opt/mercury;
    index index.html;

    # ---------- 联机 WebSocket：/ws -> 本机 8090 ----------
    # 浏览器在 http 页面下允许明文 ws，所以先用这个把联机跑通
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 静态资源：长期缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff2|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- HTML / JSON / SW：绝不缓存（改完立刻生效） ----------
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /src/sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 上传大图（地图背景 / 服装素材） ----------
    client_max_body_size 60m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
