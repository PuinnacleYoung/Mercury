# 拾光·澈屿 —— nginx 站点配置（HTTPS 版，有域名 + 证书后用这个）
# 前置：证书用 certbot 免费签：sudo certbot --nginx -d 你的域名
# 用法：sudo cp nginx-https.conf /etc/nginx/conf.d/mercury.conf（替换掉 http 版）

server {
    listen 80;
    server_name 你的域名;
    # 全部跳 https（ACME 校验路径除外）
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name 你的域名;

    ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/mercury;
    index index.html;

    # ---------- 联机 WebSocket：wss:///ws -> 本机 8090 ----------
    # https 页面下必须用 wss，客户端默认就是连同源 /ws，不用改代码
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff2|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /src/sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    client_max_body_size 60m;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
