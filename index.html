<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾光·澈屿</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#a78cd9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拾光">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<!-- 根页面只干一件事：把访客直接送进开场登录页（引擎分类/规则说明都收进管理员系统了） -->
<style>
  html,body{margin:0;height:100%;background:linear-gradient(160deg,#1b1630,#2a1f45);}
  body{display:flex;align-items:center;justify-content:center;color:#b9b0d8;
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .tip{font-size:14px;letter-spacing:2px;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  a{color:#7dd3fc;}
</style>
</head>
<body>
<div class="tip">🌊 正在进入拾光·澈屿…</div>
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);color:#fff;">
    <a href="./src/index.html">点这里进入拾光·澈屿 →</a>
  </div>
</noscript>
<script>
  /* GitHub Pages（/Mercury/）→ 游戏在 ./src/index.html；
     腾讯云服务器（裸 IP，/src/ 不对外）→ 走 /mercury/ 别名。 */
  (function(){
    var onPages = /github\.io$/i.test(location.hostname) || location.pathname.indexOf('/Mercury/') === 0;
    location.replace(onPages ? './src/index.html' : '/mercury/');
  })();
</script>
<!-- 📌 添加到桌面（PWA 安装引导）只在登录页出现（src/index.html 里引），这儿是跳转壳不重复弹 -->
<script src="./orientation-lock.js" defer></script>
<script src="./responsive.js" defer></script>
</body>
</html>
