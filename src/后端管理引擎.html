<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后端管理引擎 · 拾光·澈屿</title>
<style>
  :root{
    --c-bg:#1a1530; --c-bg2:#2a2148; --c-accent:#b49ae0; --c-accent2:#7fc4e8;
    --c-ink:#f2eefc; --c-sub:#9d94bb; --c-line:rgba(255,255,255,.12);
    --glass-rgb:255,255,255; --glass-border:rgba(255,255,255,.14);
    --gold-glow:rgba(180,154,224,.35); --shadow-rgb:0,0,0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,var(--c-bg),var(--c-bg2));color:var(--c-ink);min-height:100vh;}
  .topbar{display:flex;align-items:center;gap:16px;padding:16px 24px;background:rgba(var(--glass-rgb),.05);border-bottom:1px solid var(--c-line);position:sticky;top:0;backdrop-filter:blur(12px);z-index:10;}
  .topbar h1{font-size:20px;font-weight:800;}
  .topbar .status{margin-left:auto;font-size:13px;color:var(--c-sub);display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#f44336;}
  .dot.on{background:#4caf50;box-shadow:0 0 8px #4caf50;}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px 24px;max-width:1280px;margin:0 auto;}
  @media(max-width:860px){ .wrap{grid-template-columns:1fr;} }
  .panel{background:rgba(var(--glass-rgb),.06);border:1px solid var(--c-line);border-radius:16px;padding:18px;}
  .panel h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input{padding:9px 12px;border:2px solid var(--c-line);border-radius:10px;background:rgba(var(--glass-rgb),.06);color:var(--c-ink);font-size:14px;flex:1;min-width:140px;}
  button{cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:14px;padding:9px 16px;transition:.18s;}
  .btn{background:linear-gradient(135deg,var(--c-accent),var(--c-accent2));color:#fff;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--gold-glow);}
  .btn.ghost{background:rgba(var(--glass-rgb),.1);color:var(--c-ink);}
  .player-table{width:100%;border-collapse:collapse;font-size:13px;}
  .player-table th,.player-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--c-line);}
  .player-table th{color:var(--c-sub);font-size:12px;font-weight:700;letter-spacing:1px;}
  .player-table tr:hover td{background:rgba(var(--glass-rgb),.04);}
  .player-table .sel{background:rgba(180,154,224,.14)!important;}
  .p-ava{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;margin-right:6px;vertical-align:middle;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(var(--glass-rgb),.1);color:var(--c-sub);margin-left:6px;}
  .tag.on{background:rgba(76,175,80,.2);color:#81c784;}
  .check{width:16px;height:16px;cursor:pointer;accent-color:var(--c-accent);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--c-sub);font-weight:700;margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border:2px solid var(--c-line);border-radius:10px;background:rgba(var(--glass-rgb),.06);color:var(--c-ink);font-size:14px;font-family:inherit;}
  .field textarea{min-height:80px;resize:vertical;}
  .attach-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .attach-row select{flex:1;padding:9px;border:2px solid var(--c-line);border-radius:10px;background:rgba(var(--glass-rgb),.06);color:var(--c-ink);}
  .attach-row input{width:80px;padding:9px;border:2px solid var(--c-line);border-radius:10px;background:rgba(var(--glass-rgb),.06);color:var(--c-ink);}
  .attach-row .rm{background:#f44336;color:#fff;padding:8px 12px;}
  .hint{font-size:12px;color:var(--c-sub);line-height:1.6;margin-top:10px;}
  .admin-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99;}
  .admin-card{background:var(--c-bg2);border:1px solid var(--c-line);border-radius:18px;padding:28px;width:min(360px,90vw);text-align:center;}
  .admin-card h2{margin-bottom:16px;font-size:20px;}
  .admin-card input{width:100%;padding:12px;margin-bottom:12px;border:2px solid var(--c-line);border-radius:12px;background:rgba(var(--glass-rgb),.06);color:var(--c-ink);font-size:15px;text-align:center;}
  .admin-card .msg{color:#f44336;font-size:13px;min-height:18px;margin-top:8px;}
  .empty{text-align:center;color:var(--c-sub);padding:30px 0;font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>🖥 后端管理引擎</h1>
  <div class="status"><span class="dot" id="net-dot"></span><span id="net-text">未连接</span></div>
</div>

<div class="wrap">
  <!-- 左：玩家列表 -->
  <div class="panel">
    <h2>👥 所有玩家 <span id="player-count" style="font-size:13px;color:var(--c-sub)"></span></h2>
    <div class="toolbar">
      <input id="filter-input" placeholder="搜索昵称 / 账号…">
      <button class="btn ghost" id="btn-refresh">🔄 刷新</button>
      <button class="btn ghost" id="btn-select-all">全选</button>
      <button class="btn ghost" id="btn-clear">清空</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="player-table">
        <thead><tr>
          <th style="width:30px"><input type="checkbox" class="check" id="check-all"></th>
          <th>玩家</th><th>五行</th><th>金币</th><th>钻石</th><th>珍珠</th><th>背包</th><th>好友</th><th>注册时间</th>
        </tr></thead>
        <tbody id="player-tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty-tip" style="display:none">暂无玩家数据（玩家需先登录过游戏才会出现在这里）</div>
  </div>

  <!-- 右：发邮件 -->
  <div class="panel">
    <h2>✉️ 发邮件</h2>
    <div class="field">
      <label>收件人（已选 <span id="sel-count">0</span> 人）</label>
      <div class="hint" id="sel-preview">未选择任何玩家</div>
    </div>
    <div class="field">
      <label>邮件标题</label>
      <input id="mail-title" placeholder="例如：周末福利发放">
    </div>
    <div class="field">
      <label>正文</label>
      <textarea id="mail-body" placeholder="给玩家的通知内容…"></textarea>
    </div>
    <div class="field">
      <label>附带资产（可选）</label>
      <div id="attach-list"></div>
      <button class="btn ghost" id="btn-add-attach" style="width:100%">+ 添加资产</button>
    </div>
    <button class="btn" id="btn-send-mail" style="width:100%;padding:12px;font-size:15px">📤 发送邮件</button>
    <div class="hint" id="send-msg"></div>
  </div>
</div>

<!-- 管理员登录 -->
<div class="admin-mask" id="admin-mask">
  <div class="admin-card">
    <h2>🔐 管理员登录</h2>
    <input id="admin-user" placeholder="账号" value="1">
    <input id="admin-pass" placeholder="密码" type="password" value="1">
    <button class="btn" id="admin-go" style="width:100%">进入后台</button>
    <div class="msg" id="admin-msg"></div>
  </div>
</div>

<script src="./net-client.js"></script>
<script>
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);

/* ================= 管理员门禁 ================= */
const ADMIN_USER='1', ADMIN_PASS='1';
function doAdminLogin(){
  const u=$('admin-user').value.trim(), p=$('admin-pass').value;
  if(u===ADMIN_USER && p===ADMIN_PASS){
    sessionStorage.setItem('adminLogin','true');
    $('admin-mask').style.display='none';
    connectServer();
  } else {
    $('admin-msg').textContent='账号或密码不对';
  }
}
$('admin-go').onclick=doAdminLogin;
$('admin-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doAdminLogin(); });
if(sessionStorage.getItem('adminLogin')==='true'){ $('admin-mask').style.display='none'; connectServer(); }

/* ================= 服务器连接 ================= */
const ADMIN_KEY = 'admin123';
let players = [];
let selected = new Set();

function connectServer(){
  Net.on('adminPlayers', m=>{ players = m.list || []; renderPlayers(); });
  Net.on('sys', m=>{ $('send-msg').textContent = m.msg || ''; });
  Net.connect().then(()=>{
    $('net-dot').classList.add('on');
    $('net-text').textContent='已连接';
    refresh();
  }).catch(e=>{
    $('net-text').textContent='连接失败（请先启动 server/server.js）';
  });
}
function refresh(){ Net.send({ t:'adminList', adminKey:ADMIN_KEY }); }

/* ================= 玩家列表渲染 ================= */
function renderPlayers(){
  const tb = $('player-tbody'); tb.innerHTML='';
  const kw = $('filter-input').value.trim().toLowerCase();
  const list = players.filter(p=>{
    if(!kw) return true;
    return (p.nickname||'').toLowerCase().includes(kw) || (p.username||'').toLowerCase().includes(kw);
  });
  $('player-count').textContent = '共 ' + players.length + ' 人';
  $('empty-tip').style.display = players.length ? 'none' : 'block';
  list.forEach(p=>{
    const av = avatarEmoji(p.avatar);
    const online = isOnline(p.username);
    const tr = document.createElement('tr');
    if(selected.has(p.username)) tr.classList.add('sel');
    const cur = p.currency || {};
    tr.innerHTML = `
      <td><input type="checkbox" class="check row-check" data-u="${p.username}" ${selected.has(p.username)?'checked':''}></td>
      <td><span class="p-ava" style="background:${av.bg}">${av.em}</span>${p.nickname || p.username}
        <span class="tag ${online?'on':''}">${online?'在线':''}</span>
        <div style="font-size:11px;color:var(--c-sub)">@${p.username}</div></td>
      <td>${elementName(p.element)}</td>
      <td>🪙${cur.coin||0}</td><td>💎${cur.diamond||0}</td><td>🦪${cur.pearl||0}</td>
      <td>${(p.inventory||[]).reduce((s,i)=>s+(i.qty||1),0)}</td>
      <td>${(p.friends||[]).length}</td>
      <td style="font-size:11px;color:var(--c-sub)">${p.createdAt?new Date(p.createdAt).toLocaleDateString():'-'}</td>`;
    tb.appendChild(tr);
  });
  updateSelPreview();
}
const AVATARS = {fox:{em:'🦊',bg:'#ff9d6e'},cat:{em:'🐱',bg:'#f4a8c8'},bear:{em:'🐻',bg:'#d9a066'},rabbit:{em:'🐰',bg:'#b7d9a8'},deer:{em:'🦌',bg:'#c3a98a'},panda:{em:'🐼',bg:'#b8c4d0'},dragon:{em:'🐉',bg:'#a89bd9'},phoenix:{em:'🦚',bg:'#7fc4e8'}};
function avatarEmoji(id){ return AVATARS[id] || {em:'🙂',bg:'#888'}; }
function elementName(id){ const m={metal:'金',wood:'木',water:'水',fire:'火',earth:'土'}; return m[id] || '-'; }
function isOnline(uname){
  // 通过 Net 缓存的在线列表判断（若有）
  return false;
}

/* ================= 选择逻辑 ================= */
document.addEventListener('change', e=>{
  if(e.target.classList.contains('row-check')){
    const u = e.target.dataset.u;
    if(e.target.checked) selected.add(u); else selected.delete(u);
    renderPlayers();
  }
  if(e.target.id==='check-all'){
    if(e.target.checked){ players.forEach(p=>selected.add(p.username)); }
    else selected.clear();
    renderPlayers();
  }
});
$('btn-select-all').onclick=()=>{ players.forEach(p=>selected.add(p.username)); renderPlayers(); };
$('btn-clear').onclick=()=>{ selected.clear(); renderPlayers(); };
$('btn-refresh').onclick=refresh;
$('filter-input').oninput=renderPlayers;
function updateSelPreview(){
  $('sel-count').textContent = selected.size;
  if(!selected.size){ $('sel-preview').textContent='未选择任何玩家（留空则发给所有人）'; return; }
  const names = [...selected].map(u=>{ const p=players.find(x=>x.username===u); return p?(p.nickname||u):u; }).join('、');
  $('sel-preview').textContent = names;
}

/* ================= 资产附件 ================= */
let attaches = [];
const ATTACH_TYPES = [
  {id:'coin',label:'🪙 金币'},{id:'diamond',label:'💎 钻石'},{id:'pearl',label:'🦪 珍珠'},
  {id:'clothes',label:'👗 衣服(按itemId)'},{id:'item',label:'📦 功能道具(进背包)'},
];
function renderAttaches(){
  const box=$('attach-list'); box.innerHTML='';
  attaches.forEach((a,i)=>{
    const row=document.createElement('div'); row.className='attach-row';
    row.innerHTML=`
      <select data-i="${i}" data-f="type">
        ${ATTACH_TYPES.map(t=>`<option value="${t.id}" ${a.type===t.id?'selected':''}>${t.label}</option>`).join('')}
      </select>
      <input data-i="${i}" data-f="qty" type="number" min="1" value="${a.qty||1}" placeholder="数量" ${a.type==='clothes'?'style="display:none"':''}>
      <input data-i="${i}" data-f="itemId" value="${a.itemId||''}" placeholder="道具ID/名字" ${a.type==='item'||a.type==='clothes'?'':'style="display:none"'}>
      <button class="rm" data-i="${i}">✕</button>`;
    box.appendChild(row);
  });
}
$('btn-add-attach').onclick=()=>{ attaches.push({type:'coin',qty:1,itemId:''}); renderAttaches(); };
document.addEventListener('click', e=>{
  if(e.target.classList.contains('rm')){
    attaches.splice(Number(e.target.dataset.i),1); renderAttaches();
  }
});
document.addEventListener('input', e=>{
  const i=e.target.dataset.i, f=e.target.dataset.f;
  if(i===undefined || !f) return;
  const a = attaches[Number(i)];
  if(f==='type'){ a.type=e.target.value; renderAttaches(); }
  else if(f==='qty'){ a.qty=Number(e.target.value)||1; }
  else if(f==='itemId'){ a.itemId=e.target.value; }
});

/* ================= 发送邮件 ================= */
$('btn-send-mail').onclick=()=>{
  const title = $('mail-title').value.trim();
  const body = $('mail-body').value.trim();
  if(!title && !body){ $('send-msg').textContent='请填写标题或正文'; return; }
  const targets = selected.size ? [...selected] : ['all'];
  const attach = attaches.map(a=>{
    const o = { type:a.type, qty:Number(a.qty)||1 };
    if(a.type==='item'){ o.itemId=a.itemId||'item'; o.name=a.itemId||'道具'; o.icon='📦'; o.kind='functional'; }
    if(a.type==='clothes'){ o.itemId=a.itemId; }
    return o;
  });
  Net.send({ t:'adminMail', adminKey:ADMIN_KEY, targets, title, body, attach: attach.length?attach:null });
  $('send-msg').textContent='已提交发送请求，等待服务器确认…';
};
</script>
</body>
</html>
